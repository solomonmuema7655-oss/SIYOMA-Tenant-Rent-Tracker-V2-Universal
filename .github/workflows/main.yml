name: SIYOMA Tenant Rent Tracker Universal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Universal Edition
        run: |
          mkdir -p site
          unzip -o SIYOMA_Tenant_Rent_Tracker_V2_UNIVERSAL.zip -d extracted
          cp -r extracted/SIYOMA_Tenant_Rent_Tracker_V2_UNIVERSAL/* site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
